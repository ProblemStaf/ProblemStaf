
services:
  mongodb:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  coturn:
    image: coturn/coturn
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "60000-60100:60000-60100/udp"
    command: --no-multicast-peers --listening-port 3478 --tls-listening-port 5349 --min-port=60000 --max-port=60100 --user=user1:password1 --realm=yourdomain.com

  server:
    build: ./server
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
      - coturn
    environment:
      - MONGO_URI=mongodb://mongodb:27017/messenger
      - JWT_SECRET=your_jwt_secret

  client:
    build: ./client
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  mongodb_data: